  <defs>
    <linearGradient id="faceA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2de2f0"/><stop offset=".52" stop-color="#397cff"/><stop offset="1" stop-color="#7d43f2"/></linearGradient>
    <linearGradient id="faceB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1769e8"/><stop offset="1" stop-color="#4e2bd2"/></linearGradient>
    <linearGradient id="faceC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4b8cff"/><stop offset="1" stop-color="#b04df0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#287bff" stop-opacity=".24"/><stop offset="1" stop-color="#07101f" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
